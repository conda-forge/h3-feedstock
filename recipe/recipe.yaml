schema_version: 1

context:
  name: h3
  version: "4.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/uber/h3/archive/v${{ version }}.tar.gz
  sha256: 0da8a392a6ff77e76b60e6a331a49497d0935b6b7b6899da7a3e2786139b0441
  patches:
    - patches/relax-cellstomultipoly-area-tolerance.patch

build:
  number: 0
  skip: win and vc<14
  dynamic_linking:
    missing_dso_allowlist:
      - "*"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - make

tests:
  - package_contents:
      include:
        - h3/h3api.h
      lib:
        - if: win
          then: h3.lib
          else: h3
      bin:
        - if: win
          then: h3.dll

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Hexagonal hierarchical geospatial indexing system
  homepage: https://github.com/uber/h3
  repository: https://github.com/uber/h3
  documentation: https://uber.github.io/h3/

extra:
  recipe-maintainers:
    - mxr-conda
    - geoHeil
    - benhuff
    - oblute
